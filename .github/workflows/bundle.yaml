name: Bundle Release

on:
  # Run when a release is published
  release:
    types:
      - published

jobs:
  bundle-and-release:
    name: Bundle and release library
    runs-on: ubuntu-latest
    permissions:
      contents: write # Used to upload the bundled library
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Install Roc
        uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
      - name: Bundle and release the library
        uses: hasnep/bundle-roc-library@v0.3.0
        with:
          library: package/main.roc # Path to the library's entrypoint
          token: ${{ github.token }}
